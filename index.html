<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    width=1920 forces the viewport to the native 1080p canvas.
    On 4K TVs webOS scales the whole page up automatically.
  -->
  <meta name="viewport" content="width=1920">
  <title>Immich</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       SETUP VIEW  — shown on first run / after disconnect
  ═══════════════════════════════════════════════════════ -->
  <div id="view-setup" class="view">
    <div class="setup-card">
      <div class="setup-logo">Immich</div>
      <p class="setup-hint">
        Open Immich on any browser → Account Settings → API Keys → New Key.<br>
        Paste the key below, then press Connect.
      </p>

      <div class="field">
        <label class="field-label" for="server-url">Server URL</label>
        <input id="server-url" class="focusable" type="text"
               placeholder="https://photos.example.com"
               autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label class="field-label" for="api-key">API Key</label>
        <input id="api-key" class="focusable" type="password"
               placeholder="Paste your Immich API key"
               autocomplete="off">
      </div>

      <div id="setup-error" class="error-msg" style="display:none"></div>

      <button id="connect-btn" class="focusable btn btn-primary">Connect</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       HOME VIEW
  ═══════════════════════════════════════════════════════ -->
  <div id="view-home" class="view" style="display:none">
    <div class="topbar">
      <span class="logo">Immich</span>
      <div class="topbar-actions">
        <button id="albums-btn" class="focusable btn">Albums</button>
        <button id="disconnect-btn" class="focusable btn btn-subtle">Disconnect</button>
      </div>
    </div>

    <h2 class="section-title">Recent</h2>
    <div id="recent-scroll" class="hscroll">
      <div id="recent-strip" class="hstrip"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       ALBUMS VIEW
  ═══════════════════════════════════════════════════════ -->
  <div id="view-albums" class="view" style="display:none">
    <div class="topbar">
      <button id="albums-back" class="focusable btn">← Back</button>
      <span class="view-title">Albums</span>
      <span id="albums-count" class="count-label"></span>
    </div>
    <div id="albums-scroll" class="vscroll">
      <div id="albums-grid" class="grid"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       ALBUM DETAIL VIEW
  ═══════════════════════════════════════════════════════ -->
  <div id="view-album-detail" class="view" style="display:none">
    <div class="topbar">
      <button id="detail-back" class="focusable btn">← Back</button>
      <span id="detail-title" class="view-title"></span>
      <span id="detail-count" class="count-label"></span>
    </div>
    <div id="detail-scroll" class="vscroll">
      <div id="detail-grid" class="grid"></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PHOTO / VIDEO VIEWER  — fullscreen overlay
  ═══════════════════════════════════════════════════════ -->
  <div id="view-photo" class="view" style="display:none">
    <img id="photo-img" class="media" src="" alt="" style="display:none">
    <video id="photo-video" class="media" src="" style="display:none"
           preload="auto" playsinline></video>

    <!-- Controls — auto-hide after 3 s, reappear on any key/click -->
    <div id="photo-controls" class="photo-controls">
      <button id="photo-back"      class="focusable btn">← Back</button>
      <div class="photo-center-controls">
        <button id="photo-prev"    class="focusable btn">◀ Prev</button>
        <span   id="photo-counter" class="counter"></span>
        <button id="photo-next"    class="focusable btn">Next ▶</button>
      </div>
      <button id="slideshow-btn"   class="focusable btn">▶ Slideshow</button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       GLOBAL LOADING SPINNER
  ═══════════════════════════════════════════════════════ -->
  <div id="loading" class="loading-overlay" style="display:none">
    <div class="spinner"></div>
  </div>

  <!-- Scripts — plain globals, no bundler, no ES modules.
       Order matters: storage → api → nav → app -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
